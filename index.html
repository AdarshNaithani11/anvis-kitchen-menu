<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E10">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Anvi's Kitchen Menu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: black-and-gold hero with a one-line logo, sticky category chips,
   then one card per category with a gold-on-black icon. */
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#17150F; --muted:#726C60; --line:#E9E4D8;
  --hot1:#0E0E10; --hot2:#1E1E22; --hot3:#34343A; --sun:#F5C542; --on-hot:#FFFFFF; --a1:#8F6400; --a2:#F5C542; --on-a1:#FFFFFF; --on-gold:#1A1400;
  --chip:#FFFFFF; --veg:#16803A; --nonveg:#B4451C; --wa:#128C4B;
  --shadow:0 1px 2px rgba(30,25,20,.06),0 14px 30px -16px rgba(40,30,20,.3);
  --script:"Kaushan Script","Brush Script MT",cursive;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0C0E; --surface:#19191C; --ink:#F6F1E4; --muted:#A8A295; --line:#2C2C31;
  --a1:#F5C542; --on-a1:#1A1400;
  --chip:#19191C; --veg:#4CC46E; --nonveg:#F08A55; --wa:#1FA65C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 30px -16px rgba(0,0,0,.8);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0C0E; --surface:#19191C; --ink:#F6F1E4; --muted:#A8A295; --line:#2C2C31;
  --a1:#F5C542; --on-a1:#1A1400;
  --chip:#19191C; --veg:#4CC46E; --nonveg:#F08A55; --wa:#1FA65C;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 30px -16px rgba(0,0,0,.8);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:var(--on-hot);border-radius:0 0 30px 30px;
  background:linear-gradient(120deg,var(--hot1),var(--hot2) 45%,var(--hot3) 85%,var(--hot2));background-size:220% 100%;
  animation:sizzle 12s ease-in-out infinite alternate;box-shadow:0 18px 34px -20px var(--hot2)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:240px;height:240px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(245,197,66,.4),transparent 68%);animation:float 7s ease-in-out infinite}
.hero::after{width:200px;height:200px;left:-80px;bottom:-110px;background:radial-gradient(circle,rgba(245,197,66,.22),transparent 68%);animation:float 9s ease-in-out infinite reverse}
.hero .wrap{position:relative;z-index:1;padding-block:56px 26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{margin:0;display:flex;align-items:center;gap:.32em;white-space:nowrap;font-size:clamp(1.75rem,8.4vw,3rem);line-height:1;font-weight:400;
  text-shadow:0 2px 0 rgba(0,0,0,.4)}
.logo .a{font-family:var(--script);color:#FF8A1F;font-size:1.12em;padding-right:.04em;animation:slideL .6s .15s both}
.logo .k{font-weight:800;font-size:.8em;letter-spacing:.09em;text-transform:uppercase;color:#EF2B2D;animation:slideR .6s .25s both}
.tag{margin:0;display:flex;align-items:center;gap:10px;font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  background:rgba(255,255,255,.06);border:1px solid rgba(245,197,66,.5);border-radius:999px;padding:7px 14px;animation:rise .6s .4s both}
.eq{display:flex;align-items:flex-end;gap:2px;height:13px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--sun);transform-origin:bottom;animation:beat .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.45s}.eq i:nth-child(4){animation-delay:.1s}

/* ---------- light / dark switch ---------- */
body{transition:background-color .35s,color .35s}
.mode{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(245,197,66,.5);color:var(--sun);cursor:pointer;padding:0;
  transition:transform .45s cubic-bezier(.2,1.5,.4,1),background .2s;-webkit-tap-highlight-color:transparent}
.mode:hover{background:rgba(255,255,255,.16)}
.mode:active{transform:scale(.88) rotate(60deg)}
.mode svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;grid-area:1/1;transition:transform .5s cubic-bezier(.2,1.5,.4,1),opacity .3s}
.mode .i-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
.mode[data-mode="dark"] .i-sun{opacity:1;transform:none}
.mode[data-mode="dark"] .i-moon{opacity:0;transform:rotate(90deg) scale(.4)}

/* ---------- sticky bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);animation:rise .6s .45s both}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 .92rem var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;cursor:pointer;transition:color .25s,border-color .25s,transform .2s,box-shadow .25s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--a1);border-color:transparent;color:var(--on-a1);box-shadow:0 8px 16px -8px var(--a1)}
.vegtoggle{flex:none;display:flex;align-items:center;gap:7px;font:600 .85rem var(--body);color:var(--ink);
  background:transparent;border:0;border-radius:999px;padding:6px 2px 6px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.track{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line);box-shadow:inset 0 0 0 1px var(--muted);padding:3px;transition:background .25s,box-shadow .25s}
.knob{display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.vegtoggle[aria-checked="true"] .track{background:var(--veg);box-shadow:inset 0 0 0 1px var(--veg)}
.vegtoggle[aria-checked="true"] .knob{transform:translateX(18px)}
button:focus-visible,a:focus-visible{outline:3px solid var(--a2);outline-offset:2px}

/* ---------- menu ---------- */
.menu{display:grid;grid-template-columns:1fr;gap:16px;padding-block:8px;align-items:start}
@media (min-width:760px){.menu{grid-template-columns:1fr 1fr;gap:20px}}
.cat{--c1:var(--a1);--c2:var(--a2);
  scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px);min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);padding:6px 6px 8px;position:relative;overflow:hidden;
  animation:rise .6s both;animation-delay:calc(.5s + var(--i)*.08s);transition:transform .3s,border-color .3s}
.cat::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--a2),var(--a1),var(--a2))}
.cat.pulse{transform:scale(1.015);border-color:var(--c1)}
.cat-head{display:flex;align-items:center;gap:12px;padding:16px 12px 10px}
.tile{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,var(--hot1),var(--hot3));
  box-shadow:inset 0 0 0 1px rgba(245,197,66,.45),0 8px 14px -8px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.tile svg{width:26px;height:26px;fill:none;stroke:var(--sun);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat:hover .tile,.cat.pulse .tile{transform:rotate(-10deg) scale(1.1)}
.cat h2{font:700 1.22rem/1.15 var(--body);margin:0;text-wrap:balance}
.cat .count{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
.cat .note{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--on-gold);background:var(--a2);border-radius:999px;padding:4px 11px;white-space:nowrap}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease,opacity .3s ease}
.item.out{grid-template-rows:0fr;opacity:0}
.row{overflow:hidden;min-height:0}
.row-in{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer;
  transition:background .2s,transform .2s;-webkit-tap-highlight-color:transparent}
.item + .item .row-in{box-shadow:0 -1px 0 var(--line)}
.row-in:hover{background:var(--bg)}
.row-in:active{transform:scale(.985)}
.mark.v,.mark.n{flex:none;width:15px;height:15px;border:1.6px solid currentColor;border-radius:4px;display:grid;place-items:center}
.mark.v::after,.mark.n::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.mark.v{color:var(--veg)} .mark.n{color:var(--nonveg)}
.name{flex:1;min-width:0;font-weight:500;font-size:1.03rem}
.price{font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap;border-radius:999px;padding:5px 12px;
  background:var(--bg);background:color-mix(in srgb,var(--c1) 15%,var(--surface))}
.row-in.tap .price{animation:pop .45s ease}
.prices{display:flex;gap:6px;flex:none}
.prices .price{width:66px;padding-inline:0;text-align:center}
.colhead{display:flex;justify-content:flex-end;gap:6px;padding:0 12px 2px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.colhead span{width:66px;text-align:center}
.best{margin-left:6px;font-size:1.05rem;line-height:1;color:var(--a1);color:color-mix(in srgb,var(--a2) 70%,var(--a1))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- footer ---------- */
.foot{padding-block:26px 110px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.thanks{font-family:var(--script);font-size:1.5rem;margin:0;color:var(--ink);color:color-mix(in srgb,var(--a1) 65%,var(--ink))}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:.88rem}
.legend span{display:flex;align-items:center;gap:6px}
.phone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:.95rem}
.phone b{color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}
.copy{font:600 .8rem var(--body);color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}

.wa{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;font:600 .95rem var(--body);
  padding:12px 16px 12px 13px;border-radius:999px;box-shadow:0 10px 22px -8px rgba(0,0,0,.5);animation:rise .6s 1s both}
.wa::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--wa);animation:ring 2.6s ease-out infinite}
.wa svg{width:22px;height:22px;fill:#fff;flex:none}

/* ---------- welcome intro (three.js) ---------- */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 50% 60%,#1B1206,#0A0A0C 62%);cursor:pointer;
  transition:opacity 1.4s ease-in-out;-webkit-tap-highlight-color:transparent;overflow:hidden}
#intro.bye{opacity:0;pointer-events:none}
#intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#intro .line{position:absolute;left:0;right:0;text-align:center;font:600 .8rem var(--body);letter-spacing:.34em;text-transform:uppercase;
  color:#F5C542;opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
#intro .line.show{opacity:1;transform:none}
#intro .skip{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;
  font:500 .78rem var(--body);letter-spacing:.12em;color:rgba(255,255,255,.5)}
html.intro-on{overflow:hidden}
html.intro-on body *:not(#intro):not(#intro *){animation-play-state:paused!important}

@keyframes sizzle{from{background-position:0 0}to{background-position:100% 0}}
@keyframes float{50%{transform:translate(-14px,16px) scale(1.12)}}
@keyframes beat{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes markin{from{opacity:0;transform:scale(.3) rotate(-30deg)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{40%{transform:scale(1.22) rotate(-3deg)}}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.3,1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
/* cover the page straight away so the welcome animation is the first thing seen */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var d = document.createElement("div"); d.id = "intro";
  d.innerHTML = '<div class="line" id="introLine">Bites · Flavors · Beats</div><div class="skip">Tap to skip</div>';
  document.body.appendChild(d); document.documentElement.classList.add("intro-on");
  window.__introFail = setTimeout(function(){ d.remove(); document.documentElement.classList.remove("intro-on"); }, 12000);
})();
</script>

<header class="hero">
  <button class="mode" id="mode" type="button" data-mode="light" aria-label="Switch to dark mode">
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.500M12 19v2.500M2.500 12H5M19 12h2.500M5.300 5.300l1.800 1.800M16.900 16.900l1.800 1.800M5.300 18.700l1.800-1.800M16.900 7.100l1.800-1.800"/></svg>
  </button>
  <div class="wrap">
    <h1 class="logo" aria-label="Anvi's Kitchen">
      <span class="a">Anvi's</span><span class="k">Kitchen</span>
    </h1>
    <p class="tag"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Bites · Flavors · Beats</p>

</header>

<nav class="bar" aria-label="Menu sections">
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <button class="vegtoggle" id="vegOnly" type="button" role="switch" aria-checked="false"><span class="mark v"></span>Veg only<span class="track"><span class="knob"></span></span></button>
  </div>
</nav>

<main class="wrap"><div class="menu" id="menu"></div></main>

<footer class="foot wrap">
  <p class="thanks">Thank you for visiting</p>
  <div class="legend"><span><i class="mark v"></i>Veg</span><span><i class="mark n"></i>Egg / Chicken</span><span><b class="best" style="margin:0">★</b>Bestseller</span></div>
  <div class="phone">WhatsApp <b id="num">+91 95604 06068</b><button class="copy" id="copy" type="button">Copy number</button></div>
</footer>

<a class="wa" href="https://wa.me/919560406068" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm0 18.200a8.200 8.200 0 0 1-4.200-1.200l-.300-.200-3 .800.800-2.900-.200-.300A8.200 8.200 0 1 1 12 20.200Zm4.500-6.100c-.200-.100-1.500-.700-1.700-.800-.200-.100-.400-.100-.600.100l-.8 1c-.1.2-.3.2-.5.1a6.700 6.700 0 0 1-3.300-2.900c-.3-.4.3-.4.7-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.100 2.100-.3 3.500a11 11 0 0 0 4.500 4.300c1.900.8 2.500.7 3.300.4.600-.2 1.500-.9 1.600-1.500.1-.3.1-.4-.3-.5Z"/></svg>
  Contact us
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ICON = {
  momos:  '<path d="M3 16c0-5.500 4-10 9-10s9 4.500 9 10z"/><path d="M8 9.500l1 3M12 8v3.500M16 9.500l-1 3M3 19h18"/>',
  snacks: '<path d="M4 12h16a8 8 0 0 1-16 0z"/><path d="M9 4c-1 1.500 1 2.500 0 4.500M14 4c-1 1.500 1 2.500 0 4.500"/>',
  burgers:'<path d="M4 10.500a8 5.500 0 0 1 16 0z"/><path d="M3 14h18M5 17.500h14v.500a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/>',
  fries:  '<path d="M6 11h12l-1.500 10h-9z"/><path d="M8.500 11V4.500M11.500 11V3M14.500 11V4.500M17 11V6.500"/>',
  rolls:  '<path d="M5 15.500L14.500 6a3.200 3.200 0 0 1 4.500 4.500L9.500 20z"/><path d="M14 7l4 4M5 15.500l-1.500 5 5-1.500"/>',
  pasta:  '<path d="M3 15h18a9 5.500 0 0 1-18 0z"/><path d="M7 15c0-4 2-6.500 5-6.500s5 2.500 5 6.500M10 15c0-2 .800-3.300 2-3.300s2 1.300 2 3.300M18 3v6"/>'
};

/* ===== EDIT THE MENU HERE =====  type: "v" = veg, "n" = egg / chicken; with cols, give prices as [half, full]; add true at the end for a Bestseller star */
const MENU = [
  { id:"momos",   name:"Momos",          cols:["Half","Full"], items:[
    ["Veg Steam Momos",[40,70],"v"], ["Veg Lazy Momos",[50,80],"v",true], ["Veg Kurkure Momos",[60,100],"v"] ]},
  { id:"snacks",  name:"Snacks & Chaat", items:[
    ["Veg Spring Roll",100,"v"], ["Onion Rings",90,"v"], ["Veg Chowmein",70,"v"], ["Aloo Tikki Chaat",70,"v",true] ]},
  { id:"burgers", name:"Burgers",        items:[
    ["Veg Burger",80,"v"], ["Veg Cheese Burger",100,"v"], ["Chicken Burger",100,"n"], ["Chicken Cheese Burger",120,"n"] ]},
  { id:"fries",   name:"French Fries",   items:[
    ["French Fries Salted",70,"v"], ["Peri Peri Fries",90,"v"], ["Peri Peri Cheese Fries",110,"v"] ]},
  { id:"rolls",   name:"Rolls",          items:[
    ["Double Egg Roll",80,"n"], ["Double Egg Chicken Roll",120,"n"] ]},
  { id:"pasta",   name:"Pasta",          items:[
    ["Pasta Red Sauce",150,"v"], ["Pasta White Sauce",150,"v"] ]}
];

const menuEl = document.getElementById("menu"), chipsEl = document.getElementById("chips");
const esc = s => s.replace(/&/g,"&amp;");

MENU.forEach((c,i) => {
  const sec = document.createElement("section");
  sec.className = "cat"; sec.id = "cat-" + c.id;
  sec.style.setProperty("--i", i);
  sec.innerHTML =
    `<div class="cat-head"><span class="tile"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[c.id] || ""}</svg></span>` +
    `<div><h2>${esc(c.name)}</h2><span class="count">${c.items.length} items</span></div>` +
    (c.note ? `<span class="note">${c.note}</span>` : "") + `</div>` +
    (c.cols ? `<div class="colhead">${c.cols.map(x => `<span>${x}</span>`).join("")}</div>` : "") + `<ul class="items">` +
    c.items.map(([n,p,t,best]) =>
      `<li class="item" data-type="${t}"><div class="row"><div class="row-in">` +
      `<span class="mark ${t}"></span><span class="vh">${t==="v"?"Veg":"Non-veg"}</span>` +
      `<span class="name">${esc(n)}${best ? `<span class="best" aria-hidden="true">★</span><span class="vh"> Bestseller</span>` : ""}</span>` + (Array.isArray(p)
        ? `<span class="prices">${p.map((x,j) => `<span class="price"><span class="vh">${c.cols[j]} </span>₹${x}</span>`).join("")}</span>`
        : `<span class="price">₹${p}</span>`) +
      `</div></div></li>`).join("") + `</ul>`;
  menuEl.appendChild(sec);

  const chip = document.createElement("button");
  chip.type = "button"; chip.className = "chip"; chip.id = "chip-" + c.id; chip.textContent = c.name;
  chip.addEventListener("click", () => {
    sec.scrollIntoView({behavior:"smooth", block:"start"});
    setActive(c.id);
    sec.classList.add("pulse"); setTimeout(() => sec.classList.remove("pulse"), 900);
  });
  chipsEl.appendChild(chip);
});

/* highlight the chip for the section in view */
function setActive(id){
  chipsEl.querySelectorAll(".chip").forEach(ch => ch.classList.toggle("on", ch.id === "chip-" + id));
  const on = document.getElementById("chip-" + id);
  if (on) chipsEl.scrollTo({left: on.offsetLeft - chipsEl.offsetLeft - 12, behavior:"smooth"});
}
setActive(MENU[0].id);
if ("IntersectionObserver" in window && matchMedia("(max-width:759px)").matches){
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) setActive(e.target.id.slice(4)); });
  }, {rootMargin:"-25% 0px -65% 0px"});
  document.querySelectorAll(".cat").forEach(s => io.observe(s));
}

/* veg-only toggle */
const vegBtn = document.getElementById("vegOnly");
vegBtn.addEventListener("click", () => {
  const on = vegBtn.getAttribute("aria-checked") !== "true";
  vegBtn.setAttribute("aria-checked", on);
  document.querySelectorAll(".item").forEach(li => li.classList.toggle("out", on && li.dataset.type !== "v"));
  MENU.forEach(c => {
    const empty = on && c.items.every(it => it[2] !== "v");
    document.getElementById("cat-" + c.id).hidden = empty;
    document.getElementById("chip-" + c.id).hidden = empty;
  });
});

/* little price pop on tap */
menuEl.addEventListener("click", e => {
  const r = e.target.closest(".row-in"); if (!r) return;
  r.classList.remove("tap"); void r.offsetWidth; r.classList.add("tap");
  setTimeout(() => r.classList.remove("tap"), 500);
});

/* light / dark switch: follows the phone's setting until the visitor taps it */
const modeBtn = document.getElementById("mode"), rootEl = document.documentElement;
const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const curMode = () => rootEl.getAttribute("data-theme") || (darkMQ.matches ? "dark" : "light");
function showMode(){
  const m = curMode();
  modeBtn.dataset.mode = m;
  modeBtn.setAttribute("aria-label", m === "dark" ? "Switch to light mode" : "Switch to dark mode");
}
let savedMode = null; try { savedMode = localStorage.getItem("anvi-mode"); } catch (_) {}
if (savedMode === "dark" || savedMode === "light") rootEl.setAttribute("data-theme", savedMode);
showMode();
darkMQ.addEventListener && darkMQ.addEventListener("change", showMode);
modeBtn.addEventListener("click", () => {
  const next = curMode() === "dark" ? "light" : "dark";
  rootEl.setAttribute("data-theme", next);
  try { localStorage.setItem("anvi-mode", next); } catch (_) {}
  showMode();
});

/* copy number */
document.getElementById("copy").addEventListener("click", function(){
  const done = () => { this.textContent = "Copied"; setTimeout(() => this.textContent = "Copy number", 1600); };
  const pick = () => { const s = getSelection(), r = document.createRange(); r.selectNodeContents(document.getElementById("num")); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText("+919560406068").then(done, pick); } catch (_) { pick(); }
});

<script>
/* Welcome intro: glowing embers swirl in and assemble into "Welcome to Anvi's Kitchen",
   hold, then drift upward like smoke, left to right, while the menu fades in underneath. Tap anywhere to skip. */
(function(){
  const box = document.getElementById("intro"), root = document.documentElement;
  if (!box) return;
  const bail = () => { clearTimeout(window.__introFail); box.remove(); root.classList.remove("intro-on"); };
  if (!window.THREE) { bail(); return; }
  clearTimeout(window.__introFail);
  const T = window.THREE;
  let renderer, raf = 0, done = false, leaving = false;
  function finish(){
    if (leaving) return; leaving = true;
    root.classList.remove("intro-on"); box.classList.add("bye");
    setTimeout(() => { done = true; cancelAnimationFrame(raf); try { renderer && renderer.dispose(); } catch (_) {} box.remove(); }, 1450);
  }
  try {
    renderer = new T.WebGLRenderer({antialias:false, alpha:true});
  } catch (_) { bail(); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  box.insertBefore(renderer.domElement, box.firstChild);
  box.addEventListener("click", () => { skipAt = skipAt || clock(); });
  const safety = setTimeout(finish, 10000);
  let skipAt = 0, t0 = 0; const clock = () => (performance.now() - t0) / 1000;

  const fontsReady = Promise.race([
    Promise.all([document.fonts.load('400 100px "Kaushan Script"'), document.fonts.load('800 100px "Outfit"'), document.fonts.load('600 100px "Outfit"')]),
    new Promise(r => setTimeout(r, 1800))
  ]).catch(() => {});

  fontsReady.then(() => { try { start(); } catch (_) { clearTimeout(safety); finish(); } });

  function spaced(ctx, text, cx, y, gap){
    let w = 0; for (const ch of text) w += ctx.measureText(ch).width + gap; w -= gap;
    let x = cx - w / 2; ctx.textAlign = "left";
    for (const ch of text){ ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + gap; }
  }

  function start(){
    /* 1. draw the words on a hidden canvas and sample them into points */
    const CW = 1000, CH = 640, c = document.createElement("canvas"); c.width = CW; c.height = CH;
    const g = c.getContext("2d", {willReadFrequently:true}); g.textBaseline = "middle";
    g.fillStyle = "#F5C542"; g.font = '600 56px "Outfit",system-ui,sans-serif'; spaced(g, "WELCOME TO", CW/2, 80, 16);
    g.fillStyle = "#FF8A1F"; g.font = '400 250px "Kaushan Script","Brush Script MT",cursive'; g.textAlign = "center"; g.fillText("Anvi's", CW/2, 290);
    g.fillStyle = "#EF2B2D"; g.font = '800 150px "Outfit",system-ui,sans-serif'; spaced(g, "KITCHEN", CW/2, 520, 14);
    const px = g.getImageData(0, 0, CW, CH).data, pts = [], STEP = 4;
    let x0 = CW, x1 = 0, y0 = CH, y1 = 0;
    for (let y = 0; y < CH; y += STEP) for (let x = 0; x < CW; x += STEP){
      const i = (y * CW + x) * 4;
      if (px[i+3] > 140){ pts.push(x, y, px[i]/255, px[i+1]/255, px[i+2]/255); if (x<x0) x0=x; if (x>x1) x1=x; if (y<y0) y0=y; if (y>y1) y1=y; }
    }
    const n = pts.length / 5; if (!n) throw 0;
    const tw = x1 - x0, th = y1 - y0, blockAspect = th / tw;

    /* 2. scene */
    const scene = new T.Scene(), cam = new T.PerspectiveCamera(50, 1, 1, 1000); cam.position.z = 100;
    const group = new T.Group(); scene.add(group);
    const dot = document.createElement("canvas"); dot.width = dot.height = 64;
    const dg = dot.getContext("2d"), gr = dg.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.35,"rgba(255,255,255,.85)"); gr.addColorStop(1,"rgba(255,255,255,0)");
    dg.fillStyle = gr; dg.fillRect(0,0,64,64);
    const sprite = new T.CanvasTexture(dot);

    const pos = new Float32Array(n*3), col = new Float32Array(n*3);
    const tx = new Float32Array(n), ty = new Float32Array(n), sx = new Float32Array(n), sy = new Float32Array(n), sz = new Float32Array(n);
    const dl = new Float32Array(n), sp = new Float32Array(n), ph = new Float32Array(n), ex = new Float32Array(n), ey = new Float32Array(n), ez = new Float32Array(n), od = new Float32Array(n), alpha = new Float32Array(n);
    for (let i = 0; i < n; i++){
      tx[i] = (pts[i*5] - x0) / tw - .5; ty[i] = -((pts[i*5+1] - y0) / tw - blockAspect/2);
      col[i*3] = pts[i*5+2]; col[i*3+1] = pts[i*5+3]; col[i*3+2] = pts[i*5+4];
      const a = Math.random()*6.283, r = .9 + Math.random()*.9;
      sx[i] = Math.cos(a)*r; sz[i] = Math.sin(a)*r*.6; sy[i] = (Math.random()*2 - 1)*1.3;
      dl[i] = Math.random()*.55 + (tx[i] + .5)*.25; sp[i] = (Math.random() < .5 ? -1 : 1) * (.6 + Math.random()*.8); ph[i] = Math.random()*6.283;
      ex[i] = .12 + (Math.random()-.5)*.5; ey[i] = .55 + Math.random()*.6; ez[i] = (Math.random()-.5)*.6;
      od[i] = (tx[i] + .5)*.45 + Math.random()*.25; alpha[i] = 1;
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute("position", new T.BufferAttribute(pos, 3)); geo.setAttribute("color", new T.BufferAttribute(col, 3));
    geo.setAttribute("alpha", new T.BufferAttribute(alpha, 1));
    /* points with their own fade, so each spark can dissolve separately */
    const VS = "attribute float alpha; uniform float uSize; uniform float uScale; varying vec3 vC; varying float vA;" +
      "void main(){ vC = color; vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = uSize * uScale / -mv.z; gl_Position = projectionMatrix * mv; }";
    const FS = "uniform sampler2D uMap; uniform float uOpacity; varying vec3 vC; varying float vA;" +
      "void main(){ float a = texture2D(uMap, gl_PointCoord).a * vA * uOpacity; if (a < .004) discard; gl_FragColor = vec4(vC, a); }";
    const mk = add => new T.ShaderMaterial({vertexShader:VS, fragmentShader:FS, vertexColors:true, transparent:true, depthWrite:false,
      blending: add ? T.AdditiveBlending : T.NormalBlending, uniforms:{uMap:{value:sprite}, uOpacity:{value:0}, uSize:{value:1}, uScale:{value:1}}});
    const mat = mk(false), glow = mk(true);
    group.add(new T.Points(geo, glow)); group.add(new T.Points(geo, mat));

    /* drifting embers in the background */
    const m = 170, epos = new Float32Array(m*3), eb = new Float32Array(m*4);
    for (let i = 0; i < m; i++){ eb[i*4] = (Math.random()*2-1)*1.3; eb[i*4+1] = Math.random()*3; eb[i*4+2] = (Math.random()*2-1)*.7; eb[i*4+3] = .12 + Math.random()*.25; }
    const egeo = new T.BufferGeometry(); egeo.setAttribute("position", new T.BufferAttribute(epos, 3));
    const emat = new T.PointsMaterial({size:1, map:sprite, color:0xFFA632, transparent:true, depthWrite:false, opacity:0, blending:T.AdditiveBlending});
    group.add(new T.Points(egeo, emat));

    const line = box.querySelector("#introLine");
    function fit(){
      const w = box.clientWidth || innerWidth, h = box.clientHeight || innerHeight;
      renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
      const vh = 2 * 100 * Math.tan(25 * Math.PI / 180), vw = vh * cam.aspect;
      const s = Math.min(vw * .86, vh * .5 / blockAspect); group.scale.setScalar(s);
      mat.uniforms.uSize.value = s * STEP / tw * 2.3; glow.uniforms.uSize.value = mat.uniforms.uSize.value * 3.2; emat.size = s * .012;
      mat.uniforms.uScale.value = glow.uniforms.uScale.value = renderer.domElement.height * .5;
      line.style.top = (h/2 + (s * blockAspect / 2) / vh * h + 26) + "px";
    }
    fit(); addEventListener("resize", fit);

    const IN = .3, DUR = 1.7, HOLD = 3.9; t0 = performance.now();
    function frame(){
      if (done) return; raf = requestAnimationFrame(frame);
      const t = clock(), tOut = skipAt ? Math.min(skipAt, HOLD) : HOLD;
      const lt = t - tOut; let o = lt / 2; o = o < 0 ? 0 : o > 1 ? 1 : o;
      for (let i = 0; i < n; i++){
        let e = (t - IN - dl[i]) / DUR; e = e < 0 ? 0 : e > 1 ? 1 : e; e = 1 - (1-e)*(1-e)*(1-e);
        const k = 1 - e, ox = (sx[i]-tx[i])*k, oz = sz[i]*k, a = k*k*3.4*sp[i], ca = Math.cos(a), sa = Math.sin(a);
        let x = tx[i] + ox*ca - oz*sa, z = ox*sa + oz*ca, y = ty[i] + (sy[i]-ty[i])*k;
        if (k === 0){ x += Math.sin(t*3 + ph[i])*.0016; y += Math.cos(t*2.6 + ph[i])*.0016; }
        if (lt > 0){
          /* each spark lets go in turn (left to right), rises and curls away, fading as it goes */
          let q = (lt - od[i]) / 1.15; q = q < 0 ? 0 : q > 1 ? 1 : q; const q2 = q*q*(3 - 2*q), w = Math.sin(q*4.5 + ph[i]) * .045 * q;
          x += ex[i]*q2 + w; y += ey[i]*q2*q; z += ez[i]*q2; alpha[i] = 1 - q2;
        }
        pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
      }
      geo.attributes.position.needsUpdate = true; if (lt > 0) geo.attributes.alpha.needsUpdate = true;
      for (let i = 0; i < m; i++){
        const yy = ((eb[i*4+1] + t*eb[i*4+3]) % 3) - 1.5;
        epos[i*3] = eb[i*4] + Math.sin(t*.9 + i)*.05; epos[i*3+1] = yy; epos[i*3+2] = eb[i*4+2];
      }
      egeo.attributes.position.needsUpdate = true;
      const fin = Math.min(t / .5, 1);
      mat.uniforms.uOpacity.value = .95 * fin; glow.uniforms.uOpacity.value = .3 * fin; emat.opacity = .75 * fin * (1 - o);
      cam.position.x = Math.sin(t*.55)*5; cam.position.y = Math.cos(t*.4)*2.5; cam.position.z = 100 - o*o*(3 - 2*o)*7; cam.lookAt(0,0,0);
      renderer.render(scene, cam);
      if (t > IN + DUR + .45 && !o) line.classList.add("show");
      if (o) line.classList.remove("show");
      if (lt > .85){ clearTimeout(safety); finish(); }
    }
    frame();
  }
})();
</script>
